[project]
name = "gm-autoplayer"
version = "0.1.0"
description = "Pure-LLM browser-game player: a LangChain agent driving the Playwright MCP server"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.3.10",
    "langchain-openai>=1.1.14",
    "langchain-mcp-adapters>=0.1.13",
    "mcp>=1.21.1,<2",
    "python-dotenv>=1.2.0",
    "typesafe-sdk>=0.7.5",
]
